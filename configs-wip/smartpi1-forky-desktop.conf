# Debian 14 (forky, testing) XFCE desktop — experimental.
# Same recipe as smartpi1-trixie-desktop (only the release differs);
# configng's xfce.yaml declares forky on armhf with the same pipewire
# switch as trixie. Build with the "Build single image" workflow, move
# to configs/ once it proves stable.
BOARD="smartpi1"
BOOTSIZE="512"
BOOTFS_TYPE="fat"           # use FAT filesystem for the /boot directory
RELEASE="forky"
BUILD_DESKTOP="yes"
DESKTOP_APPGROUPS_SELECTED="browsers"
DESKTOP_ENVIRONMENT=xfce
DESKTOP_ENVIRONMENT_CONFIG_NAME=config_base
PACKAGE_LIST_BOARD="${PACKAGE_LIST_BOARD} onboard lm-sensors xinput x11-xserver-utils"
