# Debian 13 (trixie) i3 window manager — experimental.
# configng i3-wm.yaml declares trixie on armhf (status supported); the
# lightest desktop in the catalog, keyboard-driven — best fit for a
# bare SmartPi One on a monitor. Pilots DESKTOP_TIER=mid (DE + browser,
# ~1 GB). Build with the "Build single image" workflow.
BOARD="smartpi1"
BOOTSIZE="512"
BOOTFS_TYPE="fat"           # use FAT filesystem for the /boot directory
RELEASE="trixie"
BUILD_DESKTOP="yes"
DESKTOP_ENVIRONMENT=i3-wm
DESKTOP_TIER=mid
PACKAGE_LIST_BOARD="${PACKAGE_LIST_BOARD} lm-sensors xinput x11-xserver-utils"
