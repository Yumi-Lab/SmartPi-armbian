# Debian 14 (forky, testing) server image — experimental.
# Lives in configs-wip/ so the main BuildImages matrix ignores it; build it
# with the "Build single image" workflow. Move to configs/ once it proves
# stable (and add the forky name mapping to BuildImages.yml).
BOARD="smartpi1"
BOOTSIZE="512"
BOOTFS_TYPE="fat"           # use FAT filesystem for the /boot directory
RELEASE="forky"
PACKAGE_LIST_BOARD="${PACKAGE_LIST_BOARD} lm-sensors"
