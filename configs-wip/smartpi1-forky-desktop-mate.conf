# Debian 14 (forky, testing) MATE desktop — experimental.
# configng mate.yaml declares forky on armhf (pipewire, like trixie).
# Also pilots the new DESKTOP_TIER system (mid = DE + browser, ~1 GB)
# instead of the legacy DESKTOP_APPGROUPS_SELECTED that maps to the
# 2.5 GB full tier. Build with the "Build single image" workflow.
BOARD="smartpi1"
BOOTSIZE="512"
BOOTFS_TYPE="fat"           # use FAT filesystem for the /boot directory
RELEASE="forky"
BUILD_DESKTOP="yes"
DESKTOP_ENVIRONMENT=mate
DESKTOP_TIER=mid
PACKAGE_LIST_BOARD="${PACKAGE_LIST_BOARD} onboard lm-sensors xinput x11-xserver-utils"
