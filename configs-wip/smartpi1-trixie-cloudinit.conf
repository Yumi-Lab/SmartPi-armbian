# EXPERIMENTAL — trixie server + Armbian's official cloud-init extension.
# Goal: Raspberry Pi Imager customization screen support (WiFi/SSH/hostname
# at flash time). The Imager writes cloud-init user-data/network-config to
# the FAT boot partition when the catalog entry declares init_format
# "cloudinit"; the NoCloud datasource (fs_label armbi_boot) picks them up at
# first boot. Proven in production on non-RPi hardware by MainsailOS
# (Orange Pi images in the official Imager catalog).
# Note: the extension disables the interactive armbian first-login wizard.
# Validate the first-boot experience on hardware before promoting this to
# every image in configs/.
BOARD="smartpi1"
BOOTSIZE="512"
BOOTFS_TYPE="fat"           # required by the cloud-init extension (NoCloud seed on FAT)
RELEASE="trixie"
ENABLE_EXTENSIONS="cloud-init"
PACKAGE_LIST_BOARD="${PACKAGE_LIST_BOARD} lm-sensors"
