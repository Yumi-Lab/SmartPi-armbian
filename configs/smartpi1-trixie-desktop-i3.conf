# Debian 13 (trixie) i3 window manager. The lightest desktop in the
# catalog, keyboard-driven — best fit for a bare SmartPi One on a
# monitor. First matrix image on the new DESKTOP_TIER system (mid =
# DE + browser). Validated experimentally on 2026-07-28, promoted to
# the matrix the same day.
BOARD="smartpi1"
BOOTSIZE="512"
BOOTFS_TYPE="fat"           # use FAT filesystem for the /boot directory
RELEASE="trixie"
BUILD_DESKTOP="yes"
DESKTOP_ENVIRONMENT=i3-wm
DESKTOP_TIER=mid
PACKAGE_LIST_BOARD="${PACKAGE_LIST_BOARD} lm-sensors xinput x11-xserver-utils"
