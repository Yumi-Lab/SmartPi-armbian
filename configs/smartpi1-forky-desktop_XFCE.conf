# Debian 14 (forky, testing) XFCE desktop. Same recipe as
# smartpi1-trixie-desktop; needs the net-network-manager extension
# override (forky renamed the NM applet package). Validated in the
# single-image workflow on 2026-07-29, promoted the same day.
BOARD="smartpi1"
BOOTSIZE="512"
BOOTFS_TYPE="fat"           # use FAT filesystem for the /boot directory
RELEASE="forky"
BUILD_DESKTOP="yes"
DESKTOP_APPGROUPS_SELECTED="browsers"
DESKTOP_ENVIRONMENT=xfce
DESKTOP_ENVIRONMENT_CONFIG_NAME=config_base
PACKAGE_LIST_BOARD="${PACKAGE_LIST_BOARD} onboard lm-sensors xinput x11-xserver-utils"
