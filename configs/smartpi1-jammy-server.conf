BOARD="smartpi1"
BOOTSIZE="512"
BOOTFS_TYPE="fat"           # use FAT filesystem for the /boot directory
RELEASE="jammy"

# armbian/build 0ab7e3d7a (2026-08) has the BSP ship /usr/lib/sysctl.d/50-default.conf,
# replacing linux-sysctl-defaults, its owner on newer releases. On Ubuntu 22.04 the
# file still belongs to systemd 249, and dpkg refuses to install the BSP. A diversion
# moves systemd's copy aside (sysctl ignores the .systemd name), so the BSP installs
# as on every other release and later systemd updates land in the diverted path.
# Drop this once armbian/build handles jammy itself.
function post_install_kernel_debs__jammy_divert_systemd_sysctl_defaults() {
	display_alert "jammy" "diverting systemd's sysctl defaults for the Armbian BSP" "info"
	chroot_sdcard dpkg-divert --package "armbian-bsp-cli-${BOARD}-${BRANCH}${EXTRA_BSP_NAME}" --rename \
		--divert /usr/lib/sysctl.d/50-default.conf.systemd --add /usr/lib/sysctl.d/50-default.conf
}
