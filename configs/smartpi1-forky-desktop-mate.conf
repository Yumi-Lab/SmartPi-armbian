# Debian 14 (forky, testing) MATE desktop. Uses the DESKTOP_TIER system
# (mid = DE + browser). Needs tools/fix-nm-applet-in-framework.sh: the
# armbian-config package still lists network-manager-gnome, which forky
# renamed. Validated on hardware on 2026-07-30, promoted the same day.
BOARD="smartpi1"
BOOTSIZE="512"
BOOTFS_TYPE="fat"           # use FAT filesystem for the /boot directory
RELEASE="forky"
BUILD_DESKTOP="yes"
DESKTOP_ENVIRONMENT=mate
DESKTOP_TIER=mid
PACKAGE_LIST_BOARD="${PACKAGE_LIST_BOARD} onboard lm-sensors xinput x11-xserver-utils"
