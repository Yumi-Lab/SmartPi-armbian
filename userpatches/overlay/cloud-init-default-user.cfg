# Raspberry Pi Imager writes its account as a singular "user:", which renames
# and extends the distribution's default user instead of creating a bare one.
# Debian's default is "debian" without the board's hardware groups: make it
# pi, with sudo and the groups the SmartPi's GPIO, I2C, SPI and serial ports
# need, so an account created from Imager works like the image's own.
system_info:
  default_user:
    name: pi
    gecos: SmartPi user
    groups: [sudo, users, adm, dialout, audio, video, plugdev, netdev, i2c, spi, gpio]
    shell: /bin/bash
    lock_passwd: true
    sudo: ["ALL=(ALL:ALL) ALL"]
