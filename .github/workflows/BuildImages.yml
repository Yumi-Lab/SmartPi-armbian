name: Build Images
on:
  push:
    branches:
      - "develop"
    paths:
      - "boards/**"
      - "configs/**"
      - ".github/workflows/BuildImages.yml"
      - "actions/**"
      - "userpatches/**"
      - "tools/**"

  pull_request:
    types: [opened, edited, reopened, synchronize]
    paths:
      - "boards/**"
      - "configs/**"
      - ".github/workflows/**"
      - "actions/**"
      - "userpatches/**"
      - "tools/**"

  workflow_dispatch:

concurrency:
  group: ci-buildtrain-${{ github.ref }}-1
  cancel-in-progress: true

jobs:
  setup:
    name: Create Matrix
    runs-on: ubuntu-latest
    outputs:
      configfiles: ${{ steps.set-matrix.outputs.configfiles }}
      time: ${{ steps.time.outputs.time }}
      armbian_ref: ${{ steps.armbian.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Matrix
        id: set-matrix
        run: |
          JSON=$(find ${{ github.workspace }}/configs -type f -name "*.conf" -printf '%f\n' | sed '/config*/d;s#.conf##' | jq -R -s -c 'split("\n")[:-1]')
          echo "configfiles=${JSON}" >> $GITHUB_OUTPUT
          echo "::group::Build Matrix"
          echo "${JSON}"
          echo "::endgroup::"

      # Armbian main moves while a run is in progress: pin one commit for every job, so the
      # kernel built once below has the same hash in all the image jobs.
      - name: Pin the Armbian commit for the whole run
        id: armbian
        run: |
          source ./configs/config-default.conf
          ref=$(git ls-remote "https://github.com/${ARMBIAN_REPOSITORY}" "refs/heads/${ARMBIAN_BRANCH}" | cut -f1)
          [[ -n "$ref" ]] || { echo "::error::could not resolve ${ARMBIAN_REPOSITORY} ${ARMBIAN_BRANCH}"; exit 1; }
          echo "ref=${ref}" >> $GITHUB_OUTPUT
          echo "Armbian ${ARMBIAN_BRANCH} pinned at ${ref}"

      - name: Get Time
        id: time
        uses: nanzm/get-time-action@v2.0
        with:
          timeZone: UTC
          format: "YYYY-MM-DD-HHmm"

  # The kernel is the same for every image of a kernel branch, and it took 54 of the 86
  # minutes of an image job, recompiled in all 12 of them. Build it once per branch here;
  # when nothing that goes into it changed since the last run, Armbian finds it in the
  # restored cache (same hash) and skips the compile. The image jobs reuse it the same way:
  # Armbian only takes a cached kernel whose hash matches, otherwise it compiles its own.
  kernel:
    name: Kernel ${{ matrix.branch }}
    runs-on: ubuntu-latest
    needs: [setup]
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: current
            configfile: smartpi1-trixie-server
          - branch: legacy
            configfile: smartpi1-bullseye-server
    steps:
      - name: Mark the start of the job
        run: touch "$RUNNER_TEMP/job-start"

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: build-configs

      - name: Restore the last kernel build
        uses: actions/cache/restore@v4
        with:
          path: prebuilt
          key: armbian-kernel-${{ matrix.branch }}-${{ github.run_id }}
          restore-keys: armbian-kernel-${{ matrix.branch }}-

      - name: Build the kernel, or find it unchanged
        uses: ./build-configs/actions/build-image
        with:
          configfile: ${{ matrix.configfile }}
          armbian_ref: ${{ needs.setup.outputs.armbian_ref }}
          prebuilt_dir: prebuilt
          compile_args: kernel KEEP_HASHED_DEB_ARTIFACTS=yes

      # Keep only this run's kernel: Armbian touches the cached packages it reuses and
      # writes the ones it builds, older ones from the restored cache are dropped.
      - name: Keep this run's kernel packages
        run: |
          rm -rf prebuilt && mkdir prebuilt
          cd build/output/packages-hashed
          find . -type f -newer "$RUNNER_TEMP/job-start" -exec cp --parents -a {} ../../../prebuilt/ \;
          cd - > /dev/null
          find prebuilt -type f | sort
          [[ -n "$(find prebuilt -name 'linux-image-*.deb')" ]] || { echo "::error::no kernel package was built or reused"; exit 1; }

      - name: Save it for the next runs
        uses: actions/cache/save@v4
        with:
          path: prebuilt
          key: armbian-kernel-${{ matrix.branch }}-${{ github.run_id }}

      - name: Hand it to the image jobs
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-kernel-${{ matrix.branch }}
          path: prebuilt
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.configfile }}
    runs-on: ubuntu-latest
    needs: [setup, kernel]
    strategy:
      fail-fast: false
      matrix:
        configfile: ${{ fromJson(needs.setup.outputs.configfiles) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: build-configs
          fetch-depth: 0

      - name: Get the kernels built for this run
        uses: actions/download-artifact@v4
        with:
          pattern: prebuilt-kernel-*
          merge-multiple: true
          path: prebuilt

      - name: Build
        uses: ./build-configs/actions/build-image
        with:
          configfile: ${{ matrix.configfile }}
          armbian_ref: ${{ needs.setup.outputs.armbian_ref }}
          prebuilt_dir: prebuilt

      - name: Generate Name Prefix
        id: image_name
        shell: bash
        run: |
          source ./build-configs/configs/config-default.conf
          # Map codename to distro version
          configfile="${{ matrix.configfile }}"
          configfile=$(echo "$configfile" | sed \
            -e 's/bullseye-/bullseye-debian11-/' \
            -e 's/bookworm-/bookworm-debian12-/' \
            -e 's/trixie-/trixie-debian13-/' \
            -e 's/forky-/forky-debian14-/' \
            -e 's/jammy-/jammy-ubuntu22.04-/' \
            -e 's/noble-/noble-ubuntu24.04-/' \
            -e 's/resolute-/resolute-ubuntu26.04-/')
          img_name="${VENDOR}-${configfile}-${{ needs.setup.outputs.time }}"
          echo "image_name=${img_name}" >> $GITHUB_OUTPUT
          echo "::group::Image name"
          echo "Image name: ${img_name}"
          echo "::endgroup::"

      - name: Rename Files
        run: |
          cd ${{ github.workspace }}/build/output/images/
          mv *.img ${{ steps.image_name.outputs.image_name }}.img
          mv *.txt ${{ steps.image_name.outputs.image_name }}.txt

      - name: Compressing Image
        run: |
          cd ${{ github.workspace }}/build/output/images/
          xz -efkvzT0 ${{ steps.image_name.outputs.image_name }}.img || true

      - name: Calculating checksums
        run: |
          cd ${{ github.workspace }}/build/output/images/
          sha256sum ${{ steps.image_name.outputs.image_name }}.img > ${{ steps.image_name.outputs.image_name }}.img.sha256
          sha256sum ${{ steps.image_name.outputs.image_name }}.img.xz > ${{ steps.image_name.outputs.image_name }}.img.xz.sha256

      - name: Upload compressed image
        uses: actions/upload-artifact@v4.3.0
        with:
          name: ${{ steps.image_name.outputs.image_name }}.img.xz
          path: ${{ github.workspace }}/build/output/images/${{ steps.image_name.outputs.image_name }}.img.xz

      - name: Upload compressed image checksum
        uses: actions/upload-artifact@v4.3.0
        with:
          name: ${{ steps.image_name.outputs.image_name }}.img.xz.sha256
          path: ${{ github.workspace }}/build/output/images/${{ steps.image_name.outputs.image_name }}.img.xz.sha256

      - name: Upload Build Summary
        uses: actions/upload-artifact@v4.3.0
        with:
          name: ${{ steps.image_name.outputs.image_name }}.txt
          path: ${{ github.workspace }}/build/output/images/${{ steps.image_name.outputs.image_name }}.txt

      # Publish the exact kernel/U-Boot packages matching the shipped images,
      # so users can (re)install headers for DKMS builds — apt.armbian.com
      # serves generic builds that do not match our custom kernel.
      # Kernel debs are identical across releases of the same branch: upload
      # them from a single job per kernel branch (current + legacy).
      - name: List built packages
        if: matrix.configfile == 'smartpi1-trixie-server' || matrix.configfile == 'smartpi1-bullseye-server'
        run: |
          find ${{ github.workspace }}/build/output/debs -name "*.deb" | sort

      - name: Upload kernel and U-Boot packages
        if: matrix.configfile == 'smartpi1-trixie-server' || matrix.configfile == 'smartpi1-bullseye-server'
        uses: actions/upload-artifact@v4.3.0
        with:
          name: ${{ matrix.configfile == 'smartpi1-bullseye-server' && 'kernel-debs-legacy' || 'kernel-debs-current' }}
          if-no-files-found: warn
          path: |
            ${{ github.workspace }}/build/output/debs/**/linux-image-*.deb
            ${{ github.workspace }}/build/output/debs/**/linux-headers-*.deb
            ${{ github.workspace }}/build/output/debs/**/linux-dtb-*.deb
            ${{ github.workspace }}/build/output/debs/**/linux-u-boot-*.deb
