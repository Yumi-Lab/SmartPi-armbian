name: Release Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version (ex: v1.5.0)"
        required: true
        type: string
      run_id:
        description: "Build Images à publier (vide = dernier réussi sur develop). Ex : la matrice verte d'une PR que develop vient de merger, même contenu sans recompiler."
        required: false
        type: string

jobs:
  create-release:
    name: Créer la Release
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.get_build.outputs.run_id }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Récupérer l'ID du dernier Build Images réussi
        id: get_build
        run: |
          RUN_ID="${{ github.event.inputs.run_id }}"
          if [ -n "$RUN_ID" ]; then
            RUN=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID")
            if [ "$(jq -r .name <<<"$RUN")" != "Build Images" ] || [ "$(jq -r .conclusion <<<"$RUN")" != "success" ]; then
              echo "::error::Run $RUN_ID is not a green Build Images run"; exit 1
            fi
            # Publish only images built from exactly what gets tagged: same build inputs as HEAD,
            # only this workflow and the docs may differ. Otherwise build develop and release that.
            SHA=$(jq -r .head_sha <<<"$RUN")
            if ! git diff --quiet "$SHA" HEAD -- . ':(exclude).github/workflows/Release.yml' ':(exclude)*.md' ':(exclude)docs'; then
              echo "::error::Run $RUN_ID was built from $SHA, whose build inputs differ from HEAD"
              git diff --stat "$SHA" HEAD -- . ':(exclude).github/workflows/Release.yml' ':(exclude)*.md' ':(exclude)docs'
              exit 1
            fi
          else
            RUN_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=success&branch=develop&per_page=50" | \
              jq -r '[.workflow_runs[] | select(.name == "Build Images")][0].id')
          fi
          echo "Dernier Build Images réussi: $RUN_ID"
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      - name: Vérifier si le tag existe déjà
        run: |
          if git rev-parse "refs/tags/${{ github.event.inputs.version }}" >/dev/null 2>&1; then
            echo "Tag déjà existant!"
            exit 1
          fi

      - name: Créer et pousser le Tag Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git tag -a "${{ github.event.inputs.version }}" -m "Release ${{ github.event.inputs.version }}"
          git push origin "${{ github.event.inputs.version }}"

      - name: Créer la Release GitHub
        run: |
          gh release create "${{ github.event.inputs.version }}" \
            --title "Release ${{ github.event.inputs.version }}" \
            --notes "Nouvelle version ${{ github.event.inputs.version }} disponible"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-files:
    name: Upload des fichiers vers la Release
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - name: Upload artifacts one by one directly to release
        run: |
          RUN_ID="${{ needs.create-release.outputs.run_id }}"
          echo "Upload depuis le build run: $RUN_ID"

          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts?per_page=100" | \
            jq -r '.artifacts[] | select(.name | test("\\.txt$") | not) | .archive_download_url + "|" + .name' | \
          while IFS='|' read url name; do
            echo "→ $name"
            curl -sL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$url" -o artifact.zip
            mkdir -p extracted
            unzip -o artifact.zip -d extracted
            rm artifact.zip
            gh release upload "${{ github.event.inputs.version }}" $(find extracted -type f) --clobber --repo "${{ github.repository }}"
            rm -rf extracted
            echo "✅ $name"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-imager-repo:
    name: Mettre a jour le depot Raspberry Pi Imager
    runs-on: ubuntu-latest
    needs: upload-files
    steps:
      - name: Dispatch PublishImagerRepo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run PublishImagerRepo.yml \
            --repo "${{ github.repository }}" \
            -f version="${{ github.event.inputs.version }}"
