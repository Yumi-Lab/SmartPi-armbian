name: Build single image

# Builds ONE image outside the main matrix, so experimental configs (new
# Debian/Ubuntu releases, new variants) can be iterated on without re-running
# the whole 8-image BuildImages matrix. Looks for the config file in
# configs-wip/ first, then in configs/.
#
# Deliberately self-contained (like BuildUboot.yml) instead of reusing
# actions/build-image: pushing changes to actions/** would auto-trigger the
# full matrix.

on:
  workflow_dispatch:
    inputs:
      configfile:
        description: "Config name (without .conf), from configs-wip/ or configs/"
        required: false
        default: "smartpi1-forky-server"
      fix_nm_applet:
        description: "Rename network-manager-gnome to network-manager-applet in the desktop package lists (needed for forky desktops until configng ships the fix)"
        type: boolean
        required: false
        default: false

jobs:
  build:
    name: Build ${{ github.event.inputs.configfile }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: build-configs
          fetch-depth: 0

      - name: Locate config file
        id: locate
        shell: bash
        run: |
          NAME="${{ github.event.inputs.configfile }}"
          for dir in configs-wip configs; do
            if [[ -f "./build-configs/${dir}/${NAME}.conf" ]]; then
              echo "configpath=${dir}/${NAME}.conf" >> $GITHUB_OUTPUT
              echo "Found: ${dir}/${NAME}.conf"
              exit 0
            fi
          done
          echo "Config ${NAME}.conf not found in configs-wip/ or configs/" >&2
          exit 1

      - name: Enable QEMU for ARM builds
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support qemu-system-arm
          sudo update-binfmts --enable qemu-arm
          sudo update-binfmts --enable qemu-aarch64
          docker run --privileged --rm tonistiigi/binfmt --install all

      - name: Free Github Runner
        uses: descriptinc/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Read configs
        id: config
        shell: bash
        run: |
          source ./build-configs/configs/config-default.conf
          source ./build-configs/${{ steps.locate.outputs.configpath }}
          echo "armbian_repository=${ARMBIAN_REPOSITORY}" >> $GITHUB_OUTPUT
          echo "armbian_branch=${ARMBIAN_BRANCH}" >> $GITHUB_OUTPUT

      - name: Checkout armbian Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: ${{ steps.config.outputs.armbian_repository }}
          ref: ${{ steps.config.outputs.armbian_branch }}
          path: build

      - name: Fix the NetworkManager applet package name in the rootfs
        if: ${{ github.event.inputs.fix_nm_applet == 'true' }}
        shell: bash
        run: |
          # Desktop packages are installed by the armbian-config .deb from
          # inside the chroot, using the yaml files IT ships in
          # /usr/share/armbian-config/desktops/yaml — not the configng git
          # clone (that one only feeds the DE picker and the cache hash), so
          # patching the clone cannot fix package names. Insert the rename
          # between the armbian-config install and the module_desktops call,
          # the only window where the files exist and are not used yet.
          python3 - <<'PY'
          path = 'build/lib/functions/rootfs/rootfs-create.sh'
          s = open(path).read()
          anchor = '\t\tchroot_sdcard_apt_get_install armbian-config\n'
          assert anchor in s, 'anchor not found: armbian-config install line moved'
          # Runs on the build host against ${SDCARD}: no chroot quoting to
          # get wrong, and it finds the files itself instead of hardcoding a
          # path that the packaging could change.
          patch = anchor + """\t\t# Yumi: Debian 14 renamed network-manager-gnome to network-manager-applet
          \t\tdeclare -a yumi_nm_yamls=()
          \t\tmapfile -t yumi_nm_yamls < <(grep -rl network-manager-gnome "${SDCARD}/usr/share" --include='*.yaml' 2> /dev/null || true)
          \t\tif [[ ${#yumi_nm_yamls[@]} -gt 0 ]]; then
          \t\t\tdisplay_alert "Yumi: renaming the NM applet package in desktop lists" "${#yumi_nm_yamls[@]} file(s)" "info"
          \t\t\trun_host_command_logged sed -i 's/network-manager-gnome/network-manager-applet/g' "${yumi_nm_yamls[@]}"
          \t\telse
          \t\t\tdisplay_alert "Yumi: no network-manager-gnome reference in the rootfs yaml" "nothing to rename" "wrn"
          \t\tfi
          """.replace('\n          ', '\n')
          open(path, 'w').write(s.replace(anchor, patch, 1))
          print('rootfs-create.sh patched')
          PY
          sed -n '/apt_get_install armbian-config/,/^\t\tfi$/p' build/lib/functions/rootfs/rootfs-create.sh

      - name: Create config-default.conf
        shell: bash
        run: |
          mkdir -p ./build/userpatches
          cp ./build-configs/configs/config-default.conf ./build/userpatches/config-settings.conf
          cat ./build-configs/${{ steps.locate.outputs.configpath }} >> ./build/userpatches/config-settings.conf
          echo "::group::Output config-settings.conf"
          cat ./build/userpatches/config-settings.conf
          echo "::endgroup::"

      - name: Add custom board configuration and userpatches
        shell: bash
        run: |
          cp -R -v ./build-configs/boards/* ./build/config/boards
          cp -R -v ./build-configs/userpatches/* ./build/userpatches

      - name: sed VERSION
        shell: bash
        run: |
          sed -i 's/-trunk//' ./build/VERSION

      - name: Build Image
        shell: bash
        env:
          # CI runners have no tty; an empty COLUMNS forwarded into the chroot
          # crashes mksh-based maintainer scripts ("COLUMNS: bad number").
          COLUMNS: "120"
        run: |
          cd ./build
          ./compile.sh settings

      - name: Fix userrights
        shell: bash
        run: |
          sudo chown -R $USER:$USER ${{ github.workspace }}/build || true
          sudo chmod 0777 -R ${{ github.workspace }}/build || true

      - name: Generate Name Prefix
        id: image_name
        shell: bash
        run: |
          source ./build-configs/configs/config-default.conf
          configfile="${{ github.event.inputs.configfile }}"
          configfile=$(echo "$configfile" | sed \
            -e 's/bullseye-/bullseye-debian11-/' \
            -e 's/bookworm-/bookworm-debian12-/' \
            -e 's/trixie-/trixie-debian13-/' \
            -e 's/forky-/forky-debian14-/' \
            -e 's/jammy-/jammy-ubuntu22.04-/' \
            -e 's/noble-/noble-ubuntu24.04-/' \
            -e 's/resolute-/resolute-ubuntu26.04-/')
          img_name="${VENDOR}-${configfile}-$(date -u +%Y-%m-%d-%H%M)"
          echo "image_name=${img_name}" >> $GITHUB_OUTPUT
          echo "Image name: ${img_name}"

      - name: Rename Files
        run: |
          cd ${{ github.workspace }}/build/output/images/
          mv *.img ${{ steps.image_name.outputs.image_name }}.img
          mv *.txt ${{ steps.image_name.outputs.image_name }}.txt || true

      - name: Compressing Image
        run: |
          cd ${{ github.workspace }}/build/output/images/
          xz -efkvzT0 ${{ steps.image_name.outputs.image_name }}.img || true

      - name: Calculating checksums
        run: |
          cd ${{ github.workspace }}/build/output/images/
          sha256sum ${{ steps.image_name.outputs.image_name }}.img > ${{ steps.image_name.outputs.image_name }}.img.sha256
          sha256sum ${{ steps.image_name.outputs.image_name }}.img.xz > ${{ steps.image_name.outputs.image_name }}.img.xz.sha256

      - name: Upload compressed image
        uses: actions/upload-artifact@v4.3.0
        with:
          name: ${{ steps.image_name.outputs.image_name }}.img.xz
          path: ${{ github.workspace }}/build/output/images/${{ steps.image_name.outputs.image_name }}.img.xz

      - name: Upload compressed image checksum
        uses: actions/upload-artifact@v4.3.0
        with:
          name: ${{ steps.image_name.outputs.image_name }}.img.xz.sha256
          path: ${{ github.workspace }}/build/output/images/${{ steps.image_name.outputs.image_name }}.img.xz.sha256
